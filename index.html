<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
header{background:var(--head);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;color:#fff}
.logo{width:36px;height:36px;border-radius:8px;background:#7DD3FC;color:#0B2540;display:grid;place-items:center;font-weight:700}
.themebtn{font:600 14px 'IBM Plex Sans',sans-serif;color:#fff;background:#2E343D;border:1px solid #4A515C;border-radius:99px;padding:8px 16px;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:8px}
.themebtn:hover{background:#3A414B}
.brand b{display:block;font-size:17px}.brand small{color:#B8BEC7;font-size:12px}
nav{max-width:1400px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav button{font:600 15px 'IBM Plex Sans',sans-serif;color:#C9CED6;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;min-height:48px;white-space:nowrap;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:#7DD3FC}
main{max-width:1400px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
h2{margin:0 0 4px;font-size:18px}
.sub{color:var(--mute);font-size:13px}
.lbl{font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.num{font:600 30px 'IBM Plex Mono',monospace}
.mono{font-family:'IBM Plex Mono',monospace}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.row>.wide{flex:999 1 600px;min-width:0}.row>.narrow{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:18px}
.chip{display:inline-block;font:600 12px 'IBM Plex Sans',sans-serif;padding:4px 10px;border-radius:99px;white-space:nowrap}
.ok{background:var(--okB);color:var(--okT)}.warn{background:var(--wB);color:var(--wT)}.bad{background:var(--bB);color:var(--bT)}.info{background:var(--iB);color:var(--iT)}.idle{background:var(--nB);color:var(--nT)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
.btn{font:600 14px 'IBM Plex Sans',sans-serif;border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn{color:#0B1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0B1020}}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:600 14px 'IBM Plex Sans',sans-serif;border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pill.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
input,select{font:500 15px 'IBM Plex Sans',sans-serif;padding:10px 12px;border:1px solid var(--mute);border-radius:8px;min-height:44px;background:var(--card);color:var(--ink)}
.bar{height:10px;background:var(--nB);border-radius:99px;overflow:hidden}.bar i{display:block;height:10px;background:var(--accent)}
.line{display:grid;grid-template-columns:1.2fr 1fr 1.3fr 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:700px){.line{grid-template-columns:1fr 1fr}}
.cand{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.cand.best{border:2px solid var(--accent);background:var(--accentSoft)}.cand.no{opacity:.6}
.kv{display:flex;flex-wrap:wrap;gap:24px;background:var(--soft);border-radius:10px;padding:12px;margin-top:12px}
.kv div{display:flex;flex-direction:column}
.trend{display:flex;align-items:flex-end;gap:16px;height:160px;border-bottom:1px solid var(--line);margin-top:10px}
.trend div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.trend i{display:block;width:100%;border-radius:6px 6px 0 0}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.note{background:var(--wB);color:var(--wT);border-radius:10px;padding:10px 14px;font-size:14px}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.step{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card)}
.step b{display:block}.step.old{background:var(--soft)}
.arrow{align-self:center;color:var(--mute);font-weight:700}
.mail{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit;margin-top:8px}
.mail.on{border:2px solid var(--accent);background:var(--accentSoft)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}

.cutrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}

.ok-box{background:var(--okB);color:var(--okT);border-radius:10px;padding:12px 14px;font-weight:600}
.warn-box{background:var(--wB);color:var(--wT);border-radius:10px;padding:12px 14px}
.knife{display:flex;height:46px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;margin-top:8px}
.knife div{display:flex;align-items:center;justify-content:center;font:600 11px 'IBM Plex Mono',monospace;border-right:1px solid var(--ink);min-width:0;overflow:hidden}

.kvl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kvl span:nth-child(odd){color:var(--mute)}
.labels{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.label{width:288px;height:432px;background:#fff;color:#000;border:1px solid #999;border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;font:13px 'IBM Plex Sans',sans-serif}
.label .big1{font:700 20px 'IBM Plex Sans',sans-serif}.label .row2{display:flex;justify-content:space-between;border-top:1px solid #000;padding-top:6px}
.label svg{width:100%;height:auto}
.kpi{background:#20252E;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}

.up{color:#4ADE80}.down{color:#FCA5A5}
.scanbox{font:600 22px 'IBM Plex Mono',monospace;width:100%;padding:14px;border:3px solid var(--accent);border-radius:10px}
.qrgrid{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.qrl{background:#fff;color:#000;border:1px dashed #888;border-radius:6px;padding:8px;display:flex;gap:8px;box-sizing:border-box;font-family:'IBM Plex Sans',sans-serif}
.qrl svg{display:block;width:100%;height:auto}
.qrl.s2x2{width:192px;height:192px;flex-direction:column;align-items:center;justify-content:center}.qrl.s2x2 .q{width:130px}
.qrl.s2x1{width:192px;height:96px;align-items:center}.qrl.s2x1 .q{width:78px;flex:none}
.qrl.s4x6{width:288px;height:432px;flex-direction:column;align-items:center;justify-content:center}.qrl.s4x6 .q{width:230px}
.qrl .t{font:700 15px 'IBM Plex Mono',monospace;text-align:center;word-break:break-all}.qrl.s4x6 .t{font-size:24px}.qrl .u{font-size:11px;text-align:center}
.lesson{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.lesson.done{border-color:var(--okT);background:var(--okB)}
.lesson ol{margin:8px 0 0 18px;padding:0}.lesson li{margin:4px 0}
.trbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accentSoft);border:1px solid var(--accent);border-radius:10px;padding:10px 14px}
.login{max-width:440px;margin:40px auto;display:flex;flex-direction:column;gap:14px}
.login input{width:100%}
.who{display:flex;gap:8px;align-items:center;color:#fff;font-size:14px}
.roleb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#print{display:none}
@media print{header,main,body::before{display:none!important}#print{display:block}

function optimize(oo){
 const o=oo||S.opt, used=o.cuts.reduce((a,c)=>a+(+c.n||0)*(+c.w||0),0);
 const avail=masters.filter(m=>m[1]===o.grade&&!S.pulled[m[0]]&&!S.alloc[m[0]]);
 const c=avail.map(m=>({id:m[0],w:m[2],ft:m[3],loc:m[4],own:m[5],fits:m[2]>=used&&used>0,enough:m[3]>=o.need,trim:+(m[2]-used).toFixed(3)}));
 c.forEach(x=>{x.can=x.fits&&x.enough;x.pct=x.fits?x.trim/x.w*100:null;});
 c.sort((a,b)=>a.can!==b.can?(a.can?-1:1):a.trim-b.trim);
 const plan=c.filter(x=>x.can).slice(0,+o.sets||1);
 const planTrim=plan.length?plan.reduce((a,x)=>a+x.trim,0)/plan.reduce((a,x)=>a+x.w,0)*100:0;
 const widest=plan.length?Math.max(...plan.map(x=>x.w)):0;
 const mach=S.machines.filter(m=>m.width>=widest).sort((a,b)=>a.width-b.width)[0];
 return {used,c,plan,planTrim,mach,short:Math.max(0,(+o.sets||1)-plan.length)};
}

const TODAY=new Date(2026,10,4);
const isBiz=d=>d.getDay()%6!==0;
function addBiz(n){const d=new Date(TODAY);let k=0;while(!isBiz(d))d.setDate(d.getDate()+1);while(k<n){d.setDate(d.getDate()+1);if(isBiz(d))k++;}return d;}
const fmtD=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'numeric',day:'numeric'});
const parseShip=t=>{const m=String(t).match(/^(\d{1,2})\/(\d{1,2})/);return m?new Date(2026,+m[1]-1,+m[2]):null;};
const hrsOf=o=>{const h=parseFloat(o.hrs);return isNaN(h)?(/master/i.test(o.qty)?parseInt(o.qty)*0.5:2):h;};
const effHrs=()=>Math.max(1,(+S.targets.hpd||8)*(+S.targets.uptime||85)/100);
function sched(){const eff=effHrs(),out={};
 S.machines.forEach(m=>{let cum=0;orders.filter(o=>o.mach===m.id&&!S.shipped[o.shop]).forEach(o=>{cum+=hrsOf(o);o._proj=addBiz(Math.floor(cum/eff));const sd=parseShip(o.ship);o._late=sd?o._proj>sd:false;});
  out[m.id]={backlog:cum,next:addBiz(Math.floor(cum/eff)),days:Math.floor(cum/eff)};});
 orders.filter(o=>!o.mach).forEach(o=>{o._proj=null;o._late=false;});return out;}
function leadFor(width,hours){const sc=sched(),eff=effHrs(),buf=+S.targets.buffer||0;
 const opts=S.machines.filter(m=>m.width>=width).map(m=>{const d=Math.floor((sc[m.id].backlog+hours)/eff)+buf;return {m,days:d,ship:addBiz(d)};}).sort((a,b)=>a.days-b.days);return opts[0]||null;}
function leadStrip(){const sc=sched(),buf=+S.targets.buffer||0,eff=effHrs();
 const all=S.machines.map(m=>sc[m.id].days+buf),lo=Math.min(...all),hi=Math.max(...all);
 return `<div class="card"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start"><div><h2>Lead time from the schedule</h2><div class="sub">Backlog hours on each machine ÷ ${eff.toFixed(1)} productive hours a day (${S.targets.hpd} scheduled × ${S.targets.uptime}% uptime), plus ${buf} day to pack and ship. Business days. Change the inputs in Settings.</div></div>
 <div style="text-align:right"><span class="lbl">Quote a new order today</span><div class="num">${lo===hi?lo:lo+'–'+hi} days</div><div class="sub">Ships ${fmtD(addBiz(lo))}${lo===hi?'':' to '+fmtD(addBiz(hi))} depending on width</div></div></div>
 <div class="grid" style="margin-top:12px">${S.machines.map(m=>{const x=sc[m.id],d=x.days+buf;return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px"><b>${esc(m.name)}</b><div class="sub">Up to ${m.width}${IN}</div><div class="mono" style="font-size:22px;font-weight:600;margin-top:6px">${d} day${d===1?'':'s'}</div><div class="sub">${x.backlog.toFixed(1)} hrs booked · open ${fmtD(x.next)}</div>${chip(d<=2?'ok':d<=5?'info':'warn',d<=2?'Short':d<=5?'Normal':'Long')}</div>`;}).join('')}</div></div>`;}
function prod(){
 const f=[['ALL','All']].concat(S.machines.map(m=>[m.id,m.name])).concat([['','Unscheduled']]);
 sched();const rows=orders.filter(o=>S.mf==='ALL'||o.mach===S.mf);
 return leadStrip()+`<div class="card"><h2>Production schedule</h2><div class="sub">${S.user&&S.user.role==='operator'?`The whole plant’s schedule. Your machine’s jobs (${esc(mName(FM()))}) are highlighted. View only.`:'Same columns as today’s sheet. One list with a machine filter instead of a tab per machine.'}</div>

 </tbody></table></div></div>`;
}

 else if(q.type==='roll'){const mm=String(q.start).match(/^(.*?)(\d+)$/)||['', 'MR-',21500];for(let i=0;i<+q.count;i++){const c=mm[1]+(+mm[2]+i);out.push({code:c,title:c,sub:'Master roll'});}}

 return Object.keys(S.ptarget).map(g=>{const t=S.ptarget[g],rolls=masters.filter(m=>m[1]===g&&!S.pulled[m[0]]),ownStock=rolls.filter(m=>m[5]==='PD stock'),cust=rolls.filter(m=>m[5]!=='PD stock');
  const use14=orders.filter(o=>o.basis===g&&!S.shipped[o.shop]).reduce((a,o)=>a+(/master/i.test(o.qty)?parseInt(o.qty):Math.max(1,(o.rolls||[]).length)),0);
  const pd=use14/14, own=t.src==='PD buys'?ownStock.length:cust.length, cov=pd?own/pd:(own?999:0);
  const val=ownStock.length*t.cost, oldest=rolls.length?Math.max(...rolls.map(m=>ageDays(m[6]))):0, ft=ownStock.reduce((a,m)=>a+m[3],0);

  else if(ownStock.length&&!use14){st='No demand · dead stock';cls='bad';}

  return {g,t,ownStock:ownStock.length,cust:cust.length,ft,use14,cov,val,over:Math.max(0,ownStock.length-t.max)*t.cost+(ownStock.length&&!use14?0:0),dead:ownStock.length&&!use14?val:0,oldest,st,cls};});

function scanLog(t,cls){S.sc.hist.unshift({t,time:'10:'+String(30+S.sc.hist.length).padStart(2,'0'),cls:cls||'ok'});S.sc.hist=S.sc.hist.slice(0,10);}
function handleScan(raw){
 const code=String(raw||'').trim().toUpperCase(),c=S.sc;if(!code)return;
 if(c.mode==='look'){c.look=lookup(raw);c.msg='Found it. Scan the next one any time.';c.cls='info';scanLog('Looked up '+code,'idle');render();setTimeout(()=>{const el=document.getElementById('scanbox');if(el)el.focus();},0);return;}
 const isLoc=/^[A-Z]-\d{2}-\d$/.test(code)&&S.bays.some(b=>b.id===code[0]), isStage=/^STAGE-/.test(code)&&S.machines.some(m=>'STAGE-'+m.id===code), m=masters.find(x=>x[0]===code);
 const say=(msg,cls)=>{c.msg=msg;c.cls=cls||'info';};
 if(c.mode==='receive'){
  if(c.step==='roll'){if(m)say(`${code} is already in inventory at ${m[4]}. Use Move instead.`,'bad');else if(!/^MR-\d+$/.test(code))say(`${esc(code)} isn’t a roll label.`,'bad');
   else{c.pending={id:code,grade:'80# FR',w:72,ft:9800,own:'PD stock'};c.step='loc';say(`New roll ${code}. Mill label read: 80# FR · 72${IN} · 9,800 ft. Now scan the rack location.`);}}
  else{if(!isLoc)say(`${esc(code)} isn’t a rack location. Scan the slot label.`,'bad');else{const p=c.pending;masters.push([p.id,p.grade,p.w,p.ft,code,p.own,'11/04']);scanLog(`Received ${p.id} → ${code}`);ledgerAdd('Receive',p.id+' · '+p.grade,p.ft,'ft',code,p.own);c.step='roll';c.pending=null;say(`Put away. ${p.id} is in ${code} and shows in inventory and the optimizer now.`,'ok');}}}
 else if(c.mode==='move'){
  if(c.step==='roll'){if(!m)say(`${esc(code)} not found. Receive it first.`,'bad');else{c.roll=code;c.step='loc';say(`${code} is in ${S.pulled[code]?'staging':m[4]}. Scan where it’s going.`);}}
  else{const r=masters.find(x=>x[0]===c.roll);if(isStage){S.pulled[r[0]]=true;scanLog(`${r[0]} → ${code}`);ledgerAdd('Pull to machine',r[0]+' · '+r[1],0,'',code,r[5]);say(`${r[0]} pulled to ${esc(mName(code.slice(6)))}. Job jacket shows it at the slitter.`,'ok');c.step='roll';}
   else if(isLoc){delete S.pulled[r[0]];const from=r[4];r[4]=code;scanLog(`${r[0]} ${from} → ${code}`);ledgerAdd('Move',r[0]+' · '+r[1],0,'',from+' → '+code,r[5]);say(`Moved ${r[0]} from ${from} to ${code}.`,'ok');c.step='roll';}else say(`${esc(code)} isn’t a rack or staging tag.`,'bad');}}
 else{
  if(c.step==='loc'){if(!isLoc)say('Scan a rack location first.','bad');else{c.cnt={loc:code,exp:masters.filter(x=>x[4]===code&&!S.pulled[x[0]]).map(x=>x[0]),found:[]};c.step='rolls';say(`Counting ${code}. Scan each roll in the slot.`);}}
  else{if(!/^MR-\d+$/.test(code))say('That’s not a roll label.','bad');else{if(!c.cnt.found.includes(code))c.cnt.found.push(code);say(`${code} counted.`);}}}
 render();setTimeout(()=>{const el=document.getElementById('scanbox');if(el)el.focus();},0);
}

}

 else if(d.m){const [i,k]=d.m.split('|');S.machines[+i][k]=(k==='width'||k==='target'||k==='rated')?+t.value:t.value;}
 else if(d.t){S.targets[d.t]=+t.value;}
 else if(d.vf){S.vf[d.vf]=t.value;}
 else if(d.df){S.crm.df[d.df]=t.value;}
 else if(d.af){S.crm.af[d.af]=t.value;}
 else if(d.qf){S.crm.qf[d.qf]=['a','grade','supply','core'].includes(d.qf)?t.value:+t.value;if(d.qf==='grade')S.crm.qf.supply=defSupply(t.value);}
 else if(d.pb){S.pb[d.pb]=+t.value;}
 else if(t.id==='lbltext'){S.lbl.text=t.value;refreshLbl();}
 else if(t.id==='lbllist'){S.lbl.list=t.value;refreshLbl();}
 else if(d.lblc){S.lbl.copies=+t.value;}
 else if(d.bol){S.bols[S.bolEdit][d.bol]=t.value;S.bols[S.bolEdit].saved=false;}
 else if(d.co){S.co[d.co]=t.value;}
 else if(d.rpft){S.fl.rp.ft=+t.value;}
 else if(d.crf){S.crf[d.crf]=t.value;}
 else if(d.cmin){const it=CITEMS.find(i=>i.part===d.cmin);it.min=+t.value;}
 else if(t.id==='crmq'){S.crm.q=t.value;const pos=t.selectionStart;render();const el=document.getElementById('crmq');el.focus();el.setSelectionRange(pos,pos);}
 else if(d.pgoal){S.paperGoal=+t.value;}
 else if(d.qr){S.qr[d.qr]=t.value;}
 else if(d.pt){const [g,k]=d.pt.split('|');S.ptarget[g][k]=+t.value;}
 else if(d.b){const [i,k]=d.b.split('|');S.bays[+i][k]=t.value;}
 else if(d.opt){S.opt[d.opt]=(d.opt==='need'||d.opt==='sets')?+t.value:t.value;}
 else if(d.cut){const [i,k]=d.cut.split('|');S.opt.cuts[+i][k]=+t.value;}
});
document.addEventListener('change',e=>{const d=e.target.dataset;
 if(LIVE&&d.m){const [i]=d.m.split('|'),m=S.machines[+i];sb.from('machines').upsert({id:m.id,name:m.name,max_width_in:m.width,type:m.type,shift_target:m.target,rated_fpm:m.rated,sort:+i+1}).then(({error})=>{if(error)alert('Not saved: '+error.message);});}
 if(LIVE&&d.t)sb.from('settings').upsert({key:'targets',value:S.targets}).then(()=>{});
 if(LIVE&&d.pgoal)sb.from('settings').upsert({key:'lean_goal',value:{dollars:S.paperGoal}}).then(()=>{});
 if(d.urole)updUser(d.urole,{role:e.target.value});
 if(d.umach)updUser(d.umach,{default_machine:e.target.value||null});if(d.opt||d.cut){S.optMsg='';render();}if(d.pgoal||d.pt||d.qr||d.t||d.qf||d.pb||d.cmin||d.bol||d.rpft)render();if(d.crf==='part')render();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em')&&!S.user&&LIVE){e.preventDefault();document.getElementById('signin').click();return;}if(e.key==='Enter'&&e.target.id==='scanbox'){e.preventDefault();handleScan(e.target.value);}});
function doPrint(html){const p=document.getElementById('print');p.innerHTML=html;drawBarcodes(p);try{window.print();}catch(e){alert('Printing is blocked in this preview. In the real system this goes straight to the label printer.');}}
let lastTouch=0;['touchstart','pointerdown','scroll'].forEach(ev=>window.addEventListener(ev,()=>{lastTouch=Date.now();},{passive:true}));
setInterval(()=>{const f=S.fl;if(f.status!=='Running')return;if(Date.now()-lastTouch<4000)return;f.fpm=Math.round(385+Math.random()*30);f.ft+=f.fpm*2/60*16;
 const a=document.activeElement;if((S.tab==='floor'&&f.view==='run'||S.tab==='dash')&&!(a&&a.tagName==='INPUT'))render();},2000);
paintThemeBtn();
render();
if(LIVE){sb.auth.getSession().then(({data})=>loadProfile(data.session));sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_IN'&&(!S.user||S.user.id!==session.user.id))loadProfile(session);if(ev==='SIGNED_OUT'){S.user=null;render();}if(ev==='PASSWORD_RECOVERY'){const pw=prompt('Enter a new password');if(pw)sb.auth.updateUser({password:pw}).then(({error})=>alert(error?error.message:'Password updated.'));}});}
</script>
